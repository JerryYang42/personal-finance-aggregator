# Production Docker Compose Configuration
# 
# This file is designed for cloud deployments where secrets are managed
# via environment variables (from CI/CD, cloud secret managers, etc.)
# 
# DO NOT commit .env files in production!
# 
# Usage:
#   export TRADING212_STOCKS_ISA_API_KEY=your_key
#   export TRADING212_STOCKS_ISA_SECRET_KEY=your_secret
#   docker compose -f docker-compose.prod.yml up -d
#   # to use override
#   docker compose -f docker-compose.prod.yml -f docker-compose.override.yml up -d

services:
  app:
    # Build configuration
    build:
      context: .
      args:
        # Set to false for clean cloud environments (no corporate proxy)
        DISABLE_SSL_CHECK: "false"
    
    # Network configuration
    ports:
      - "3000:3000"
    
    # Environment variables (from host environment or CI/CD)
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Required: API credentials (must be set before deployment)
      - TRADING212_STOCKS_ISA_API_KEY=${TRADING212_STOCKS_ISA_API_KEY}
      - TRADING212_STOCKS_ISA_SECRET_KEY=${TRADING212_STOCKS_ISA_SECRET_KEY}
    
    # Container restart policy
    restart: unless-stopped
    
    # Health monitoring
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Resource allocation (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Max 50% of one CPU core
          memory: 512M       # Max 512MB RAM
        reservations:
          cpus: '0.25'       # Guaranteed 25% of one CPU core
          memory: 256M       # Guaranteed 256MB RAM
    
    # Log management
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # Max 10MB per log file
        max-file: "3"        # Keep 3 log files (30MB total)
